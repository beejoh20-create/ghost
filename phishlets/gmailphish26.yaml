        if (!cleanEmail.includes('@')) {
          // Try to detect G Suite domain from page context
          let gsuiteDomain = null;
          
          // Method 1: Check if there's a domain selector or hint on the page
          const domainHint = document.querySelector('[data-domain], [data-email-domain], .domain-hint');
          if (domainHint) {
            gsuiteDomain = domainHint.getAttribute('data-domain') || 
                          domainHint.getAttribute('data-email-domain') ||
                          domainHint.textContent?.trim();
          }
          
          // Method 2: Check URL parameters for domain hint (hd=hosted_domain is Google's standard)
          const urlParams = new URLSearchParams(window.location.search);
          const domainParam = urlParams.get('hd') || urlParams.get('domain');
          if (domainParam) {
            gsuiteDomain = domainParam;
          }
          
          // Method 3: Check for G Suite domain in page content (common patterns)
          if (!gsuiteDomain) {
            const pageText = document.body?.textContent || '';
            // Look for common G Suite indicators in page text
            const domainMatch = pageText.match(/@([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})/);
            if (domainMatch && domainMatch[1] !== 'gmail.com' && !domainMatch[1].includes('google.com')) {
              gsuiteDomain = domainMatch[1];
            }
          }
          
          // Method 4: Check for domain in hidden form fields or data attributes
          if (!gsuiteDomain) {
            const hiddenInputs = document.querySelectorAll('input[type="hidden"][name*="domain"], input[type="hidden"][name*="hd"]');
            for (const input of hiddenInputs) {
              const value = input.value?.trim();
              if (value && value !== 'gmail.com' && !value.includes('google.com') && value.includes('.')) {
                gsuiteDomain = value;
                break;
              }
            }
          }
          
          // Append domain: G Suite if detected, otherwise Gmail
          if (gsuiteDomain && gsuiteDomain !== 'gmail.com' && !gsuiteDomain.includes('google.com')) {
            cleanEmail = cleanEmail + '@' + gsuiteDomain;
            console.log('Detected G Suite domain, using:', cleanEmail);
          } else {
            cleanEmail = cleanEmail + '@gmail.com';
            console.log('Using Gmail domain, email:', cleanEmail);
          }
        }
        
        console.log('Pre-filling email:', cleanEmail);
        
        // Robust element waiting function
        function waitForElement(selector, callback, timeout = 5000) {
          const startTime = Date.now();
          const interval = setInterval(() => {
            const element = document.querySelector(selector);
            if (element) {
              clearInterval(interval);
              callback(element);
            } else if (Date.now() - startTime > timeout) {
              clearInterval(interval);
              console.error(`Element not found: ${selector}`);
            }
          }, 100);
        }
        
        // Wait for email input
        waitForElement(
          'input[type="email"], #identifierId, input[name="identifier"], input[autocomplete="email"]',
          (emailInput) => {
            // Set value and trigger full interaction
            emailInput.value = cleanEmail;
            
            // Trigger all relevant events
            ['input', 'change', 'blur'].forEach(eventType => {
              emailInput.dispatchEvent(new Event(eventType, {
                bubbles: true,
                cancelable: true
              }));
            });
            
            console.log('Email field populated');
            
            // Wait for next button
            setTimeout(() => {
              // Comprehensive button selectors
              const buttonSelectors = [
                '#identifierNext',
                '.VfPpkd-LgbsSe',
                'button[data-primary-action="true"]',
                'button[jsname="LgbsSe"]',
                'button[aria-label="Next"]',
                'button:contains("Next")',
                'button:contains("Continue")',
                'button:contains("Sign in")'
              ];
              
              let nextButton = null;
              
              // Try all selectors
              for (const selector of buttonSelectors) {
                const btn = document.querySelector(selector);
                if (btn && btn.offsetParent !== null) {
                  nextButton = btn;
                  break;
                }
              }
              
              // Fallback: Find by text content
              if (!nextButton) {
                const buttons = document.querySelectorAll('button');
                for (const btn of buttons) {
                  if (btn.textContent.match(/next|continue|sign in/i)) {
                    nextButton = btn;
                    break;
                  }
                }
              }
              
              // Click if found
              if (nextButton) {
                console.log('Clicking next button');
                nextButton.click();
                
                // Double-check after delay
                setTimeout(() => {
                  if (document.querySelector('input[type="password"]')) {
                    console.log('Successfully advanced to password page');
                  } else {
                    console.warn('Password field not detected after click');
                  }
                }, 2000);
              } else {
                console.error('Next button not found');
              }
            }, 1500); // Increased delay
          }
        );
      }

      // Initialize with better timing
      if (document.readyState === 'complete') {
        setTimeout(initEmailPreFill, 500); // Extra delay for dynamic content
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          setTimeout(initEmailPreFill, 500);
        });
      }
